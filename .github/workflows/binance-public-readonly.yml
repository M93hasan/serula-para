name: Binance TR public read-only connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-api:
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      REAL_ORDERS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify server time and symbols over public GET
        run: node scripts/verify-binance-public-readonly.mjs
